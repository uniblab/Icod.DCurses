name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PACKAGE_ARTIFACT: release-package

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      terminal_version: ${{ steps.version.outputs.terminal_version }}
      terminfo_version: ${{ steps.version.outputs.terminfo_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in main."
          }
      - id: version
        name: Validate tag, package version, and direct dependencies
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }
          $tagVersion = $Matches.version
          [xml]$project = Get-Content -LiteralPath 'Icod.DCurses.csproj' -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          $packageVersionNode = $project.SelectSingleNode('/Project/PropertyGroup/PackageVersion')
          if ($null -eq $versionNode -or $null -eq $packageVersionNode) {
              throw 'Icod.DCurses.csproj must declare both Version and PackageVersion.'
          }
          if ($versionNode.InnerText -ne $packageVersionNode.InnerText) {
              throw "Version '$($versionNode.InnerText)' does not match PackageVersion '$($packageVersionNode.InnerText)'."
          }
          if ($tagVersion -ne $packageVersionNode.InnerText) {
              throw "Tag version '$tagVersion' does not match PackageVersion '$($packageVersionNode.InnerText)'."
          }

          $terminalNode = $project.SelectSingleNode("/Project/ItemGroup/PackageReference[@Include='Icod.Terminal']")
          $termInfoNode = $project.SelectSingleNode("/Project/ItemGroup/PackageReference[@Include='Icod.TermInfo']")
          if ($null -eq $terminalNode -or [string]::IsNullOrWhiteSpace($terminalNode.Version)) {
              throw 'Icod.DCurses.csproj must declare a versioned Icod.Terminal PackageReference.'
          }
          if ($null -eq $termInfoNode -or [string]::IsNullOrWhiteSpace($termInfoNode.Version)) {
              throw 'Icod.DCurses.csproj must declare a versioned Icod.TermInfo PackageReference.'
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "terminal_version=$($terminalNode.Version)" >> $env:GITHUB_OUTPUT
          "terminfo_version=$($termInfoNode.Version)" >> $env:GITHUB_OUTPUT

  runtime:
    needs: metadata
    name: Runtime acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore '${{ github.event.repository.name }}.sln'
      - run: dotnet build '${{ github.event.repository.name }}.sln' -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test '${{ github.event.repository.name }}.sln' -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx

  package:
    needs: metadata
    name: Package candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - shell: pwsh
        run: ./packaging/Invoke-Build.ps1 -Section validate -Configuration '${{ env.CONFIGURATION }}'
      - name: Require release package version
        shell: pwsh
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          foreach ($path in @("artifacts/Icod.DCurses.$version.nupkg", "artifacts/Icod.DCurses.$version.snupkg")) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Expected release artifact '$path' was not produced."
              }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            artifacts/Icod.DCurses.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.DCurses.${{ needs.metadata.outputs.version }}.snupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [runtime, package]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $package.Count) { throw "Expected one NuGet package; found $($package.Count)." }
          dotnet nuget push $package[0].FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "NuGet.org publication failed with status $LASTEXITCODE." }

  publish-github-packages:
    needs: [runtime, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $package = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $package.Count) { throw "Expected one GitHub package; found $($package.Count)." }
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          dotnet nuget push $package[0].FullName --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed with status $LASTEXITCODE." }

  github-release:
    needs: [metadata, publish-nuget, publish-github-packages]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.publish-nuget.result == 'success' &&
      needs.publish-github-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/release-assets
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.nupkg', '.snupkg') } | Sort-Object Name)
          if (2 -ne $files.Count) { throw "Expected package and symbol package; found $($files.Count)." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $terminalVersion = '${{ needs.metadata.outputs.terminal_version }}'
          $termInfoVersion = '${{ needs.metadata.outputs.terminfo_version }}'
          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release-assets' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $notes = @'
          ## Installation

          ```text
          dotnet add package Icod.DCurses --version {0}
          ```

          `Icod.DCurses` targets `net8.0`, `net9.0`, and `net10.0`. Its runtime package dependencies are
          `Icod.Terminal {1}` and `Icod.TermInfo {2}`.
          '@ -f $version, $terminalVersion, $termInfoVersion
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "Icod.DCurses $version", '--generate-notes', '--notes', $notes)
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw "GitHub Release creation failed with status $LASTEXITCODE." }
