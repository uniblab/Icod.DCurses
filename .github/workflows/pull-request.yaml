name: pull-request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Staging
  PACKAGE_ARTIFACT: icod-dcurses-pr-packages

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore '${{ github.event.repository.name }}.sln'
      - run: dotnet build '${{ github.event.repository.name }}.sln' -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test '${{ github.event.repository.name }}.sln' -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx

  package:
    name: Package candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - shell: pwsh
        run: ./packaging/Invoke-Build.ps1 -Section validate -Configuration '${{ env.CONFIGURATION }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
